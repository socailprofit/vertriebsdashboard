name: Close sync test

on:
  workflow_dispatch:
    inputs:
      start_date:
        description: Start date in YYYY-MM-DD (blank uses yesterday)
        required: false
        type: string
      end_date:
        description: End date in YYYY-MM-DD (blank uses start date)
        required: false
        type: string

permissions:
  contents: read

jobs:
  dry-run:
    name: Read Close without writing data
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Invoke protected Supabase function
        env:
          START_DATE_INPUT: ${{ inputs.start_date }}
          END_DATE_INPUT: ${{ inputs.end_date }}
          CLOSE_SYNC_SECRET: ${{ secrets.CLOSE_SYNC_SECRET }}
          FUNCTION_URL: https://pdobcvffnzqxtmkkpfnn.supabase.co/functions/v1/close-sync
        shell: bash
        run: |
          set -euo pipefail

          test -n "$CLOSE_SYNC_SECRET" || {
            echo "Missing GitHub secret: CLOSE_SYNC_SECRET" >&2
            exit 1
          }

          start_date="${START_DATE_INPUT:-$(date -u -d 'yesterday' +%F)}"
          end_date="${END_DATE_INPUT:-$start_date}"
          [[ "$start_date" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]]
          [[ "$end_date" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]]

          payload="$(jq -n \
            --arg mode "dry-run" \
            --arg startDate "$start_date" \
            --arg endDate "$end_date" \
            '{mode: $mode, startDate: $startDate, endDate: $endDate}')"

          # Keep status and body separate so a failed call is diagnosable from
          # this log alone. The secret is only ever passed as a header value.
          status="$(curl --silent --show-error --max-time 90 \
            --output response.json --write-out '%{http_code}' \
            --request POST \
            --header 'content-type: application/json' \
            --header "x-sync-secret: $CLOSE_SYNC_SECRET" \
            --data "$payload" \
            "$FUNCTION_URL")"

          echo "HTTP status: $status"

          if [ "$status" != "200" ]; then
            echo "Function call failed." >&2
            jq '.' response.json >&2 2>/dev/null || cat response.json >&2
            exit 1
          fi

          # This repository is public, so Actions logs are public. Print only
          # non-personal totals; named per-person KPIs stay out of the log.
          jq '{ok, mode, wroteData, scheduled, range, mappingVersion, fetched, inWindow, mapped, warnings,
               peopleSummarised: (.people | keys | length),
               peopleMetricKeys: (.people | to_entries | map(.value | keys | length) | add)}' response.json

          test "$(jq -r '.ok' response.json)" = "true"
          test "$(jq -r '.mode' response.json)" = "dry-run"
          test "$(jq -r '.wroteData' response.json)" = "false"
